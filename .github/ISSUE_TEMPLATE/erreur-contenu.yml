name: Erreur ou imprécision dans un article
description: Signaler une info fausse, périmée ou peu claire dans le Wikilude.
labels: [content]
body:
  - type: input
    id: article
    attributes:
      label: Article concerné
      description: Nom du fichier dans content/ (ex. economie.md) ou URL /wikilude/...
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Problème
      description: Qu'est-ce qui est faux, périmé ou peu clair ?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction proposée (optionnel)
